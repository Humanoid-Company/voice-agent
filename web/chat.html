<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Єва — чат</title>
  <meta name="description" content="Напишіть Єві — вона відповідає голосом.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="chat.js" defer></script>
</head>
<body class="chat-page">
  <header class="chat-top">
    <div class="chat-title">
      <h1>Єва</h1>
      <div class="status-line small">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <span id="status">Не підключено</span>
      </div>
    </div>
    <label class="chat-sound" for="sound">
      <span class="small">Голос</span>
      <input id="sound" type="checkbox" class="switch" role="switch" checked>
    </label>
  </header>

  <section id="gate" class="card chat-gate" hidden>
    <label for="code">Код доступу</label>
    <div class="row">
      <input id="code" type="password" autocomplete="off" placeholder="Отримайте в команди">
      <button id="saveCode" class="btn">Зберегти</button>
    </div>
  </section>

  <main id="messages" class="chat-log" aria-live="polite">
    <p class="muted empty">Напишіть Єві — вона відповість голосом. Це та сама розмова, що й голосом: вона
      пам'ятає все сказане раніше.</p>
  </main>

  <form id="composer" class="composer">
    <textarea id="text" rows="1" maxlength="2000" placeholder="Повідомлення для Єви" aria-label="Повідомлення для Єви"
      enterkeyhint="send"></textarea>
    <button id="send" class="btn primary" type="submit" aria-label="Надіслати">Надіслати</button>
  </form>
  <audio id="voiceOut" autoplay playsinline></audio>
</body>
</html>
