<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосові помічники — історія</title>
  <meta name="description" content="Збережені розмови з помічниками: перегляд, продовження, видалення.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="history.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <div>
        <h1>Історія</h1>
        <p class="sub">Ваші розмови з помічниками — з будь-якого пристрою, де ви увійшли. Будь-яку можна перечитати або
          продовжити — помічник згадає, про що говорили.</p>
      </div>
      <a id="backLink" class="nav-btn header-link" href="index.html">← До помічника</a>
    </header>

    <p id="storageNote" class="banner" hidden></p>

    <section class="card">
      <div class="card-head">
        <h2>Розмови</h2>
        <span id="count" class="muted small"></span>
      </div>
      <p id="msg" class="status-msg" role="status" hidden></p>
      <div id="list" class="sets"><p class="muted empty">Завантаження…</p></div>
    </section>
  </main>
</body>
</html>
