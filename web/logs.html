<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Єва · логи</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
      --accent: #2f6fed; --ok: #1f9d55; --warn: #c27c0e; --err: #d14343;
      --user: #eef3ff; --bot: #f1f2f4; --tool: #f3f0ff; --note: #fff8e6; --code: #f4f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #171a21; --text: #e8eaed; --muted: #9aa1ad; --line: #2a2f39;
        --accent: #5b8ef5; --user: #1c2742; --bot: #1f232b; --tool: #241f38; --note: #2e2716; --code: #12151b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
    header h1 { font-size: 16px; margin: 0; }
    .tabs { display: flex; gap: 4px; }
    .tabs button, .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .spacer { flex: 1; }
    input[type="password"], input[type="search"] { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; min-width: 0; }
    main { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
    main[hidden] { display: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .calls { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 120px); overflow: auto; }
    .call { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 8px 10px; cursor: pointer; font: inherit; }
    .call[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .call .top { display: flex; justify-content: space-between; gap: 8px; }
    .badge { display: inline-block; max-width: 100%; overflow-wrap: anywhere; border-radius: 6px; padding: 0 6px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.err { color: var(--err); border-color: var(--err); }
    .badge.live { color: var(--warn); border-color: var(--warn); }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
    .filters label { display: inline-flex; gap: 4px; align-items: center; }
    .timeline { display: flex; flex-direction: column; gap: 6px; }
    .ev { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: start; }
    .ev .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 6px; text-align: right; }
    .ev .b { border-radius: 10px; padding: 6px 10px; min-width: 0; overflow-wrap: anywhere; }
    .k-user .b { background: var(--user); }
    .k-eva .b { background: var(--bot); }
    .k-tool .b { background: var(--tool); }
    .k-note .b { background: var(--note); font-size: 13px; }
    .k-sys .b { color: var(--muted); font-size: 12px; padding: 2px 10px; }
    .k-err .b { border: 1px solid var(--err); color: var(--err); }
    .who { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-right: 6px; }
    pre { background: var(--code); border-radius: 8px; padding: 6px 8px; margin: 6px 0 0; overflow: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    details.long summary { color: inherit; font-size: inherit; }
    details.long[open] summary { color: var(--muted); font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
    .empty { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Єва · логи</h1>
    <div class="tabs" role="tablist">
      <button id="tabCalls" role="tab" aria-selected="true">Дзвінки</button>
      <button id="tabDiag" role="tab" aria-selected="false">Діагностика</button>
      <button id="tabUsage" role="tab" aria-selected="false">Витрати</button>
    </div>
    <span class="spacer"></span>
    <form id="tokenForm" style="display:flex;gap:6px;min-width:0;flex:1 1 220px;max-width:360px">
      <input id="token" type="password" style="flex:1" placeholder="LOGS_TOKEN" autocomplete="off" aria-label="Токен логів">
      <button class="btn" type="submit">Увійти</button>
    </form>
    <button id="refresh" class="btn" type="button">Оновити</button>
  </header>

  <main id="callsView">
    <section class="card">
      <div class="filters"><input id="callSearch" type="search" placeholder="Пошук: клієнт, голос, текст" style="width:100%"></div>
      <div id="calls" class="calls"><p class="muted empty">Введіть токен.</p></div>
    </section>
    <section class="card" id="detail"><p class="muted empty">Оберіть дзвінок зліва.</p></section>
  </main>

  <main id="diagView" hidden style="grid-template-columns:1fr">
    <section class="card"><div id="diag" class="muted">…</div></section>
  </main>

  <main id="usageView" hidden style="grid-template-columns:1fr">
    <section class="card"><div id="usage" class="muted">…</div></section>
  </main>

  <script src="config.js"></script>
  <script src="logs.js"></script>
</body>
</html>
