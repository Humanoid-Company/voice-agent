[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent Єва on OpenAI GPT-Live — web (FastAPI + browser) and desktop; a base for further work"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai[realtime]>=3.12.0",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.6",
    "pygame-ce>=2.5.0",
    "webrtcvad-wheels>=2.0.14",
    "numpy>=1.24.0,<2",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "tzdata>=2024.1",
]

[dependency-groups]
# Hosted web backend (server/): `uv sync --group server`
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# cryptography 49+ ships no macOS x86_64 wheel (it would need a Rust build): Intel Macs stay on 48.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "credentials", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # long Ukrainian prompt strings are intentional
    "SIM105", # try/except/pass is clearer than contextlib.suppress in audio paths
    "SIM102", # nested ifs often carry a comment per condition
    "SIM103",
    "SIM108",
    "UP042",  # str+Enum kept for JSON/log compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
exclude = ['^\.venv/', '^tests/']

# Mixins use attributes/methods set up by the concrete class (Assistant).
[[tool.mypy.overrides]]
module = ["voice.live_driver"]
disable_error_code = ["attr-defined"]
