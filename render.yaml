# Render Blueprint for the web backend (server/). Render → New → Blueprint → this repo.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: voice-agent-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL # e.g. https://voice-agent-backend.onrender.com
        sync: false
      - key: FRONTEND_ORIGINS # e.g. https://voice-agent.vercel.app (comma-separated)
        sync: false
      - key: LOGS_TOKEN # password of the hidden /logs page (calls and tool calls); empty = logs are open
        sync: false
      - key: TIMEZONE # for «сьогодні» and the time of day in the prompts
        value: Europe/Kyiv
      - key: WEB_SEARCH_API_KEY # Tavily, for the web_search tool; empty = she says search is unavailable
        sync: false
      - key: DATABASE_URL # Neon Postgres for «Знання» (postgresql://…?sslmode=require); empty = a SQLite file every deploy wipes
        sync: false
